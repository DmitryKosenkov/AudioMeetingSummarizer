services:
  redis:
    image: redis:7-alpine
    expose:
      - "6379"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  backend:
    build:
      context: ./backend
      args:
        WHISPER_MODEL_SIZE: ${WHISPER_MODEL_SIZE:-small}
    env_file:
      - ./backend/.env
    environment:
      - RELOAD=false
      - REDIS_URL=redis://redis:6379/0
    volumes:
      - downloads:/dockerapp/downloads
    expose:
      - "8000"
    depends_on:
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
    environment:
      - BACKEND_URL=http://backend:8000
    ports:
      - "8080:80"
    depends_on:
      - backend

volumes:
  downloads:
